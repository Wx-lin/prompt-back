# Include in nginx http {} scope. WeChat-only mini app allowlist.
# Check the original URI so nginx normalization cannot widen the profile route.
map $request_uri $mini_api_profile_canonical {
    default 0;
    "~^/mini-api/api/auth/me/profile(?:\?.*)?$" 1;
}
map $request_uri $mini_api_prompt_canonical {
    default 0;
    "~^/mini-api/api/prompt-assets(?:\?.*)?$" 1;
    "~^/mini-api/api/prompt-assets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:\?.*)?$" 1;
    "~^/mini-api/api/prompt-analyses(?:\?.*)?$" 1;
    "~^/mini-api/api/prompt-analyses/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}(?:\?.*)?$" 1;
    "~^/mini-api/api/prompt-examples(?:\?.*)?$" 1;
    "~^/mini-api/api/auth/wechat/image-to-prompt(?:\?.*)?$" 1;
}
map "$request_method:$uri" $mini_api_allowed {
    default 0;
    "~^(GET):/mini-api/api/prompts$" 1;
    "~^(GET):/mini-api/api/prompts/search$" 1;
    "~^(GET):/mini-api/api/prompts/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" 1;
    "~^(GET):/mini-api/api/prompts/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/similar$" 1;
    "~^(GET):/mini-api/api/(categories|models)$" 1;
    "~^(POST):/mini-api/api/auth/wechat$" 1;
    "~^(POST):/mini-api/api/auth/me/profile$" $mini_api_profile_canonical;
    "~^(GET):/mini-api/api/auth/me$" 1;
    "~^(GET):/mini-api/api/users/me/collects$" 1;
    "~^(POST|DELETE):/mini-api/api/prompts/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/(like|collect)$" 1;
    "~^(POST):/mini-api/api/prompt-assets$" $mini_api_prompt_canonical;
    "~^(GET):/mini-api/api/prompt-assets/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $mini_api_prompt_canonical;
    "~^(GET|POST):/mini-api/api/prompt-analyses$" $mini_api_prompt_canonical;
    "~^(GET|PATCH|DELETE):/mini-api/api/prompt-analyses/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$" $mini_api_prompt_canonical;
    "~^(GET):/mini-api/api/prompt-examples$" $mini_api_prompt_canonical;
    "~^(POST):/mini-api/api/auth/wechat/image-to-prompt$" $mini_api_prompt_canonical;
}
