location @prompt_error_401 {
    default_type application/json;
    add_header Cache-Control "private, no-store" always;
    add_header X-Request-ID $request_id always;
    return 401 '{"success":false,"data":null,"error":{"code":"UNAUTHENTICATED","message":"Authentication required"},"request_id":"$request_id"}';
}

