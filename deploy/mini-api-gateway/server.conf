# Include in the existing HTTPS server {} which can resolve api:8000.
# Public host/CDN must route /mini-api/ to this server without stripping the path.
location = /mini-api { return 404; }
location = /mini-api/api/auth/me/profile {
    if ($mini_api_allowed = 0) { return 404; }
    client_max_body_size 3m;
    rewrite ^/mini-api(/api/.*)$ $1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 25s;
    proxy_hide_header Set-Cookie;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}
location ^~ /mini-api/ {
    if ($mini_api_allowed = 0) { return 404; }
    client_max_body_size 128k;
    rewrite ^/mini-api(/api/.*)$ $1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 25s;
    proxy_hide_header Set-Cookie;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
}

location = /mini-api/api/prompt-assets {
    if ($mini_api_allowed = 0) { return 404; }
    client_max_body_size 6m;
    rewrite ^/mini-api(/api/.*)$ $1 break;
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Idempotency-Key $http_idempotency_key;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 25s;
    proxy_hide_header Set-Cookie;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store" always;
    error_page 401 = @prompt_error_401;
    error_page 403 = @prompt_error_403;
    error_page 404 = @prompt_error_404;
    error_page 413 = @prompt_error_413;
    error_page 429 = @prompt_error_429;
    error_page 502 = @prompt_error_502;
    error_page 503 = @prompt_error_503;
}

