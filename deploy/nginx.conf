server {
    listen 8082;
    server_name _;
    return 308 https://62.234.69.93:8443$request_uri;
}
server {
    listen 8443 ssl;
    server_name 62.234.69.93;
    ssl_certificate /etc/letsencrypt/live/62.234.69.93/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/62.234.69.93/privkey.pem;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    location = /health { proxy_pass http://api:8000/health; }
    location /api/admin/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
    location = /admin { return 308 /admin/; }
    location /admin/ { alias /srv/admin/; try_files $uri $uri/ /admin/index.html; }
    location /local-media/ { proxy_pass http://api:8000; }
    location /mediacrawler-media/ { proxy_pass http://api:8000; }
    location / {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 90s;
    }
}
