name: Check and deploy backend + admin
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      reviewed_migration:
        description: Reviewed additive migration for this release only
        type: choice
        default: none
        options:
          - none
          - f8b24d0c51e3
          - a3e6b18d4092
          - c74d219e8a60
          - d91a72f4b308
          - e04b75ad6312
          - b6f20a93d812
          - a85c2f87d019
          - c2b8e0364a21
permissions:
  contents: read
concurrency:
  group: production-backend
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      AIGC_TEST_DATABASE_URL: ""
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install --index-url https://pypi.org/simple uv==0.11.17
      - run: uv sync --locked --group dev
      - run: uv run --no-sync python -m ruff check app scripts tests
      - run: uv run --no-sync python -m pytest -q
      - name: Package checked commit
        run: |
          mkdir -p release
          uv run --no-sync python - <<'PYTHON'
          import runpy
          from pathlib import Path
          package = runpy.run_path("scripts/deploy_backend.py")["package_release"]
          package(Path.cwd(), Path("release/release.tar.gz"))
          PYTHON
          cp deploy/update-backend.sh release/update-backend.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-release
          path: release/
          retention-days: 7
  admin:
    runs-on: ubuntu-latest
    env:
      ADMIN_BASE_PATH: /admin/
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run lint
      - run: npm run build
      - run: tar -czf ../admin.tar.gz -C dist .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-release
          path: admin.tar.gz
          retention-days: 7
  deploy:
    needs: [backend, admin]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-release
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: admin-release
          path: release
      - name: Deploy verified artifacts
        env:
          DEPLOY_EVENT: ${{ github.event_name }}
          REVIEWED_MIGRATION: ${{ inputs.reviewed_migration }}
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${DEPLOY_HOST:?Configure DEPLOY_HOST}"
          : "${DEPLOY_USER:?Configure DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Configure DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Configure DEPLOY_KNOWN_HOSTS}"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          trap 'rm -f "$HOME/.ssh/deploy_key"' EXIT
          ssh_options=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15)
          remote="$DEPLOY_USER@$DEPLOY_HOST"
          # Audit findings depend on asymmetric JWT paths; verify the deployed setting only.
          algorithm=$(ssh "${ssh_options[@]}" "$remote" 'cd /opt/aigc-prompt && sudo -n docker compose exec -T api python -c "from app.config import get_settings; print(get_settings().jwt_algorithm)"')
          [[ "$algorithm" == HS256 ]] || { echo 'Unexpected JWT algorithm; review required before release'; exit 1; }
          echo "JWT algorithm verified: $algorithm"
          release="backend-$(date -u +%Y%m%d-%H%M%S)"
          backend_hash=$(sha256sum release/release.tar.gz | awk '{print $1}')
          admin_hash=$(sha256sum release/admin.tar.gz | awk '{print $1}')
          # Validated release names and hashes intentionally expand before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "mkdir -p /opt/aigc-prompt/releases/$release"
          scp "${ssh_options[@]}" release/release.tar.gz release/admin.tar.gz release/update-backend.sh "$remote:/opt/aigc-prompt/releases/$release/"
          migrate=false
          reviewed_target=
          if [[ "$DEPLOY_EVENT" == workflow_dispatch && ( "$REVIEWED_MIGRATION" == f8b24d0c51e3 || "$REVIEWED_MIGRATION" == a3e6b18d4092 || "$REVIEWED_MIGRATION" == c74d219e8a60 || "$REVIEWED_MIGRATION" == d91a72f4b308 || "$REVIEWED_MIGRATION" == e04b75ad6312 || "$REVIEWED_MIGRATION" == b6f20a93d812 || "$REVIEWED_MIGRATION" == a85c2f87d019 || "$REVIEWED_MIGRATION" == c2b8e0364a21 ) ]]; then
            migrate=true
            reviewed_target="$REVIEWED_MIGRATION"
          fi
          # Push deployments retain the original automatic migration whitelist.
          # Validated release names and hashes intentionally expand before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_options[@]}" "$remote" "bash /opt/aigc-prompt/releases/$release/update-backend.sh $release $backend_hash $migrate $admin_hash e7a13c9b40d2 $reviewed_target"
